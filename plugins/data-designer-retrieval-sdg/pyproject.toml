[project]
name = "data-designer-retrieval-sdg"
version = "0.3.0"
description = "Retriever SDG toolkit with Data Designer extensions, a multi-step QA generation pipeline, CLI, and Automodel-compatible data conversion"
requires-python = ">=3.10"
dependencies = [
    "data-designer>=0.9.4",
    "click>=8.3.3,<9",
    "lxml>=6.1.1,<7",
    "urllib3>=2.8.0,<3",
    "filelock>=3.20,<4",
    "tokenizers>=0.22,<0.24",
    "transformers>=5.17,<6",
    "jinja2>=3.1.6,<4",
    # Data Designer permits older transitive releases that are excluded by the
    # workspace security constraints. Publish the same floors for consumers.
    "anyio>=4.14.2,<5",
    "mcp>=1.29.0,<2",
    "nltk>=3.10.3,<3.11",
    # Pydantic 2.14 breaks CliApp.run in the supported pydantic-settings releases.
    "pydantic>=2.9.2,<2.14",
    "pydantic-settings>=2.14,<3",
    "pyyaml>=6.0",
    "pyarrow>=24.0.0,<25",
    "pillow>=12.3.0",
    "starlette>=1.4.1,<2",
]
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
multimodal = [
    "httpx>=0.28.1,<1",
    "sentence-transformers>=5.0,<7",
    "scikit-learn>=1.6,<2",
    "umap-learn>=0.5.7,<0.6",
]

[project.entry-points."data_designer.plugins"]
embedding-dedup = "data_designer_retrieval_sdg.text_qa.plugins:embedding_dedup_plugin"
document-chunker = "data_designer_retrieval_sdg.text_qa.plugins:document_chunker_plugin"
retrieval-structured = "data_designer_retrieval_sdg.multimodal.plugins:retrieval_structured_plugin"

[project.scripts]
data-designer-retrieval-sdg = "data_designer_retrieval_sdg.text_qa.cli:main"

[project.urls]
Repository = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_designer_retrieval_sdg"]

[tool.ruff]
extend = "../../pyproject.toml"
