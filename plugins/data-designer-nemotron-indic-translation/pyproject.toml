[project]
name = "data-designer-nemotron-indic-translation"
version = "0.1.0"
description = "Document translation (with optional windowing for long documents and deterministic script remapping) plugin for Nemotron Indic-language pretraining data"
requires-python = ">=3.10"
dependencies = [
    # Security floors also apply when installing this plugin outside the workspace.
    "certifi>=2026.10.19",
    # ReadWriteLock was introduced in 3.20.4; fixed 4.x requires Python 3.11.
    "filelock>=3.20,<3.20.4; python_version < '3.11'",
    "filelock>=4.2.1,<5; python_version >= '3.11'",
    "fsspec>=2026.6.0",
    "mcp>=1.30.0,<2",
    "nltk>=3.10.4,<3.11",
    # Pillow 13 fixes the reported image-parser CVEs but requires Python 3.11.
    # Python 3.10 remains supported with unresolved Pillow findings.
    "pillow>=12.3.0; python_version < '3.11'",
    "pillow>=13.0.0; python_version >= '3.11'",
    "data-designer>=0.9.4",
    "click>=8.3.3,<9",
    "lxml>=6.1.1,<7",
    "urllib3>=2.8.0,<3",
    # tokenizers, not transformers: windowed translation only needs token counts for window
    # sizing, and transformers 5.x demands huggingface-hub>=1.5, which conflicts with older
    # pinned hub versions in some deployment containers. tokenizers 0.22's bound is
    # >=0.16.4,<2.0, so it installs cleanly against either.
    "tokenizers>=0.22,<0.24",
]
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.entry-points."data_designer.plugins"]
document-translation = "data_designer_nemotron_indic_translation.plugins:document_translation_plugin"

[project.urls]
Repository = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_designer_nemotron_indic_translation"]

[tool.ruff]
extend = "../../pyproject.toml"
