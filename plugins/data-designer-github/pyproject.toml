[project]
name = "data-designer-github"
version = "0.1.0"
description = "GitHub and local git repository seed reader for Data Designer"
requires-python = ">=3.10"
dependencies = [
    # Security floors for transitive dependencies installed with DataDesigner.
    "click>=8.3.3,<9",
    "cryptography>=50.0.0,<51",
    "data-designer>=0.9.4",
    "idna>=3.18",
    "lxml>=6.1.1,<7",
    "mcp>=1.29.0,<2",
    "pillow>=12.3.0",
    "pyjwt>=2.15.1,<3",
    "python-multipart>=0.0.32",
    "starlette>=1.4.1",
    "urllib3>=2.8.0,<3",
]
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.entry-points."data_designer.plugins"]
github = "data_designer_github.plugin:plugin"

[project.urls]
Repository = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_designer_github"]

[tool.ruff]
extend = "../../pyproject.toml"
