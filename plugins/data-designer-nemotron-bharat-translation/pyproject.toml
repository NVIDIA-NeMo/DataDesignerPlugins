[project]
name = "data-designer-nemotron-bharat-translation"
version = "0.1.0"
description = "Document translation (with optional windowing for long documents and deterministic script remapping) plugin for Nemotron Bharat Indic-language pretraining data"
requires-python = ">=3.10"
dependencies = [
    "data-designer>=0.5.7",
    # tokenizers, not transformers: windowed translation only needs token counts for window
    # sizing, and transformers 5.x demands huggingface-hub>=1.5, which conflicts with older
    # pinned hub versions in some deployment containers. tokenizers 0.22's bound is
    # >=0.16.4,<2.0, so it installs cleanly against either.
    "tokenizers>=0.22,<0.24",
]
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.entry-points."data_designer.plugins"]
document-translation = "data_designer_nemotron_bharat_translation.plugins:document_translation_plugin"

[project.urls]
Repository = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_designer_nemotron_bharat_translation"]

[tool.ruff]
extend = "../../pyproject.toml"
