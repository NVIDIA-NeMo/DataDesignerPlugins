[project]
name = "data-designer-docx"
version = "0.1.0"
description = "Data Designer processor plugin that renders generated rows as Microsoft Word documents"
requires-python = ">=3.10"
dependencies = [
    # Security floors also apply when installing this plugin outside the workspace.
    "certifi>=2026.10.19",
    # ReadWriteLock was introduced in 3.20.4; fixed 4.x requires Python 3.11.
    "filelock>=3.20,<3.20.4; python_version < '3.11'",
    "filelock>=4.2.1,<5; python_version >= '3.11'",
    "fsspec>=2026.6.0",
    "mcp>=1.30.0,<2",
    "nltk>=3.10.4,<3.11",
    # Pillow 13 fixes the reported image-parser CVEs but requires Python 3.11.
    # Python 3.10 remains supported with unresolved Pillow findings.
    "pillow>=12.3.0; python_version < '3.11'",
    "pillow>=13.0.0; python_version >= '3.11'",
    "data-designer>=0.9.4",
    "click>=8.3.3,<9",
    "lxml>=6.1.1,<7",
    "urllib3>=2.8.0,<3",
    "python-docx>=1.1.0",
]
license = "Apache-2.0"
readme = "README.md"
authors = [
    {name = "NVIDIA Corporation"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.entry-points."data_designer.plugins"]
docx = "data_designer_docx.plugin:plugin"

[project.urls]
Repository = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_designer_docx"]

[tool.ruff]
extend = "../../pyproject.toml"
